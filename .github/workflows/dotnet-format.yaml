name: .NET Format

on:
  workflow_call:
  
permissions:
  contents: read
  
jobs:
  check-format:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check formatting
        run: dotnet format --no-restore --verify-no-changes --verbosity diagnostic app
