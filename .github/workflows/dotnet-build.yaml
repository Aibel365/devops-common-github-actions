name: .NET Build Artifacts

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
        description: Project to build
  
permissions:
  contents: read
  
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: .NET Restore
        run: dotnet restore app
      - name: Build
        run: dotnet build -C Release --output ./build --no-restore ${{ input.PROJECT }}
      - name: Test
        run: dotnet test -c Release app
      - name: Publish
        run: dotnet publish  --no-restore --no-build -o /app/publish ${{ input.PROJECT }}
